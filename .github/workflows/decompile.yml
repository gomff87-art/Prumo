name: Decompile
on: workflow_dispatch
permissions:
  contents: write
jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          curl -L https://repo1.maven.org/maven2/org/vineflower/vineflower/1.10.1/vineflower-1.10.1.jar -o vf.jar
          mkdir -p tmp/z tmp/out
          unzip -q zero.zip -d tmp/z
          rm -rf tmp/z/__MACOSX
          J=$(find tmp/z -type d -path '*src/main/java' | head -1)
          R=$(find tmp/z -type d -path '*src/main/resources' | head -1)
          java -jar vf.jar "$J" tmp/out/
          mkdir -p src/main/java src/main/resources
          find src -name '*.class' -delete
          cp -rn tmp/out/. src/main/java/
          if [ -n "$R" ]; then cp -rn "$R"/. src/main/resources/; fi
          rm -rf tmp vf.jar zero.zip
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Decompile zero"
          git push
