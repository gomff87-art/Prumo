name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o Prumo-cleaned.zip -d tmp
          rm Prumo-cleaned.zip
          rm -rf tmp/__MACOSX tmp/Prumo/.github
          cp -a tmp/Prumo/. .
          rm -rf tmp
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Unzip"
          git push
